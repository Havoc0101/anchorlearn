<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>接着学 · 从声音到下一步</title>
<style>
:root{font-family:system-ui;color:#213b35;background:#f4f6f2}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:48px auto;padding:0 24px 60px}header{margin-bottom:32px}h1{font-size:38px;margin:8px 0}h2{font-size:22px;margin:0 0 18px}h3{font-size:18px}p{line-height:1.7}section,.task{background:white;border:1px solid #dce4db;border-radius:18px;padding:26px;margin:18px 0}small,.muted{color:#56695f}.step{color:#377664;font-size:13px;font-weight:700;letter-spacing:2px}textarea,input,button{font:inherit}textarea{width:100%;min-height:210px;resize:vertical;padding:16px;border:1px solid #aab9ae;border-radius:10px;line-height:1.7}input{padding:10px;max-width:100%;border:1px solid #aab9ae;border-radius:8px}input[type=file]{width:100%;background:#f6f8f4;padding:24px}label{display:block;margin:14px 0 8px}button{cursor:pointer;background:#235b49;color:white;border:0;border-radius:9px;padding:12px 20px;margin:16px 8px 0 0}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#e9eee7;color:#254539}audio{width:100%;margin:18px 0}blockquote{border-left:3px solid #bdcdbb;padding-left:16px;margin-left:0;color:#53655a;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere}.task{background:#f8faf6;padding:18px}.row{display:flex;gap:22px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}#status{padding:12px 0;min-height:30px}summary{cursor:pointer;padding:12px 0}li{margin:12px 0;line-height:1.7}:focus-visible{outline:3px solid #b78b23;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){main{margin:24px auto;padding:0 16px}h1{font-size:30px}section{padding:20px}}
</style>
<main><header><div class="step">接着学 / 声音整理助手</div><h1>听过的内容，变成清楚的下一步。</h1><p class="muted">先理解重点，再看有没有需要你做的事。没有待办也没关系。</p></header>
<section><div class="step">01 / 放入音频</div><h2>从一段录音开始</h2><label for="file">选择音频文件</label><input type="file" id="file" accept=".wav,.mp3,.m4a,.mp4,.aac,.ogg,.flac,.webm"><p><small>支持 WAV、MP3、M4A、MP4、AAC、OGG、FLAC、WebM。演示版每段最多10分钟、25 MB；建议先试30秒至2分钟。</small></p><audio id="player" controls hidden></audio><button id="transcribe" disabled>转成文字</button><p class="muted">音频在本机处理，不上传到 DeepSeek。请使用你有权处理的录音。</p></section>
<section><div class="step">02 / 看一眼原文</div><h2>校对一下，再整理</h2><p class="muted">转写可能听错人名、数字。你也可以直接粘贴已有文字。</p><form id="form"><label for="text">录音文字</label><textarea id="text" maxlength="12000" required placeholder="转写结果会出现在这里，也可以直接粘贴课堂或聊天内容。"></textarea><div class="row"><div><label for="date">实际录音日期</label><input id="date" type="date" required></div><div><label for="context">我是谁 / 补充说明（选填）</label><input id="context" maxlength="500" placeholder="例如：我是小林，第一组"></div></div><button id="run">提炼重点与待办</button><small>仅文字和补充说明发送至 DeepSeek；不自动保存任务或设置提醒。</small></form></section>
<p id="status" role="status" aria-live="polite"></p><section id="cards" hidden></section><details id="debug" hidden><summary>查看接口数据（开发用）</summary><pre id="result"></pre></details></main>
<script>
const $=id=>document.getElementById(id), file=$('file'), player=$('player'), transcribe=$('transcribe'), text=$('text'), status=$('status'), cards=$('cards'), debug=$('debug'), run=$('run');
let audioURL=null,busy=false;
const now=new Date();$('date').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
function lock(value){busy=value;run.disabled=value;transcribe.disabled=value||!file.files.length;file.disabled=value;text.disabled=value;$('context').disabled=value;$('date').disabled=value;}
function clearResult(){cards.hidden=true;debug.hidden=true;}
file.onchange=()=>{clearResult();if(audioURL)URL.revokeObjectURL(audioURL);const f=file.files[0];player.hidden=!f;transcribe.disabled=!f;if(f){audioURL=URL.createObjectURL(f);player.src=audioURL;status.textContent='文件已选择。点击“转成文字”；更换录音不会自动覆盖你编辑过的文字。';}};
async function requestJSON(path,options){const res=await fetch(path,options);const data=await res.json();if(!res.ok)throw Error(data.error||'处理失败，请重试');return data;}
transcribe.onclick=async()=>{if(busy)return;const f=file.files[0];if(!f)return;if(f.size>25*1024*1024){status.textContent='文件超过25 MB，请拆分后上传。';return;}if(text.value.trim()&&!confirm('转写成功后将替换当前文字，是否继续？'))return;lock(true);clearResult();status.textContent='正在本机转写，首次加载可能较慢，请保持页面打开…';try{const data=await requestJSON('/api/transcribe',{method:'POST',headers:{'Content-Type':'application/octet-stream','X-Filename':encodeURIComponent(f.name)},body:f});text.value=data.text;if(data.text.length>12000){status.textContent='转写完成，但超过分析长度限制。请缩短到12000字以内再整理。';}else{status.textContent=data.text.trim()?'转写完成。请核对文字和录音日期，再点击“提炼重点与待办”。':'未识别到清晰语音。请回听检查音量，或尝试更清楚的片段。';}text.focus();}catch(e){status.textContent=e.message;}finally{lock(false);}};
function add(parent,tag,value){const el=document.createElement(tag);el.textContent=value;parent.appendChild(el);return el;}
function render(data){cards.replaceChildren();add(cards,'div','03 / 整理结果').className='step';add(cards,'h2','先看重点');add(cards,'p',data.reading_card);const list=document.createElement('ul');for(const point of data.key_points||[])add(list,'li',point);cards.appendChild(list);
if(data.clarifications.length){add(cards,'h2','还需要确认');for(const q of data.clarifications){add(cards,'p',q.question);add(cards,'blockquote',q.source_quote);}add(cards,'p','在上方“补充说明”中回答，再点一次整理。');}
if(data.tasks.length){add(cards,'h2','你可以做的事');for(const task of data.tasks){const box=document.createElement('div');box.className='task';add(box,'h3',task.title);add(box,'p','截止日期：'+(task.due_date||'尚未明确'));add(box,'p','建议第一步：'+task.first_step);const detail=document.createElement('details');add(detail,'summary','核对原句');add(detail,'blockquote',task.source_quote);box.appendChild(detail);cards.appendChild(box);}add(cards,'small','这些是待核对的建议，尚未保存，也没有安排提醒。');}
else{add(cards,'h2',data.clarifications.length?'先确认，再生成任务':'这次只需要了解');add(cards,'p',data.clarifications.length?'不确定的行动暂不放入你的待办。':'没有识别到明确属于你的待办，保留上面的重点即可。');}
cards.hidden=false;debug.hidden=false;$('result').textContent=JSON.stringify(data,null,2);cards.scrollIntoView({behavior:'smooth',block:'start'});}
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const original=text.value,context=$('context').value.trim();const combined=original+(context?'\n用户说明：'+context:'');if(combined.length>12000){status.textContent='文字与补充说明合计不能超过12000字，请缩短后重试。';return;}lock(true);clearResult();status.textContent='正在理解内容、提炼重点与行动…';try{render(await requestJSON('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:combined,recorded_date:$('date').value})}));status.textContent='整理完成，请核对重要日期和原句。';}catch(e){status.textContent=e.message;}finally{lock(false);}};
</script></html>
